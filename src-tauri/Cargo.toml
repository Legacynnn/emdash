[package]
name = "emdash-dev"
version = "0.1.0"
description = "Tauri 2 + Rust rewrite of emdash, shipped as a separate dev product alongside Electron emdash."
authors = ["Emdash Contributors <support@emdash.sh>"]
license = "Apache-2.0"
repository = "https://github.com/Legacynnn/emdash"
edition = "2021"
rust-version = "1.77"
default-run = "emdash-dev"

[lib]
name = "emdash_dev"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "emdash-dev"
path = "src/main.rs"

[[bin]]
# EMD-18 load-test harness. Links only domain modules (pty + registry
# + types) — must keep compiling from a non-webview entry point.
name = "pty-loadtest"
path = "src/bin/pty-loadtest.rs"

[build-dependencies]
tauri-build = { version = "=2.6.1", features = [] }
serde_json = "1"
dotenvy = "0.15"

[dependencies]
tauri = { version = "=2.11.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# DB stack — rusqlite bundled so we don't depend on system libsqlite3 version.
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
rusqlite_migration = "1.3"

# Secrets stack.
# keyring 3.x exposes platform-native backends behind feature flags. The exact
# flag names have churned across patch releases; if `cargo check` reports an
# unknown feature, replace with the current names from the keyring 3.x README
# (typically apple-native + windows-native + a sync linux backend such as
# `sync-secret-service` or `linux-native-sync-persistent`).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }

# Shared.
thiserror = "2"
parking_lot = "0.12"
directories = "5"
base64 = "0.22"

# PTY.
portable-pty = "=0.9.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# IDs.
uuid = { version = "1", features = ["v4"] }

# File watching (EMD-11 / ADR-0020). Pinned: macOS FSEvents behavior
# has churned across `notify` 6.x and 7.x releases. Helmor uses
# notify 6.1 + a maintained debouncer; we follow the same pair.
notify = "=6.1.1"
notify-debouncer-full = "=0.3.2"

# Git. `vendored-libgit2` so we don't depend on the host's libgit2 version
# (matches the `bundled` rusqlite stance). Read-heavy ops only; worktree
# create/remove shells out to the `git` CLI for parity with the user's
# environment (see EMD-17 / ADR-0005).
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }

# Telemetry / GitHub — reqwest with rustls so we don't pull in OpenSSL on
# Linux. Limited features: just JSON + TLS, no cookies/streams/etc.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Auto-updater (EMD-15 / ADR-0008). tauri-plugin-updater v2 wrapped in
# `UpdateManager` (Helmor-style) for the state machine, backoff,
# throttling, and install-on-exit hook.
tauri-plugin-updater = "2"

# Window-state persistence (EMD-20 / ADR-0009). Persists size +
# position across launches; restore happens automatically when the
# plugin is built into the App.
tauri-plugin-window-state = "2"

# Agent hook server (EMD-9 / ADR-0021). axum 0.7 on 127.0.0.1:0 with
# per-launch token validation. subtle for constant-time compare.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
tower = "0.5"
subtle = "2"

# GitHub provider (EMD-13 / ADR-0022). octocrab for REST + GraphQL.
# Device flow done manually via reqwest — oauth2 0.x's type API
# doesn't compose well with our two-call (start / poll) split.
octocrab = { version = "0.42", default-features = false, features = ["default-client", "rustls", "rustls-ring", "rustls-webpki-tokio"] }
url = "2"


[dev-dependencies]
insta = { version = "1.47", features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
# Used in agent_hooks::server tests to round-trip the axum server.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
